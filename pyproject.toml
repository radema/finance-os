[project]
name = "financeos"
version = "0.1.0"
description = "Local-first personal finance decision support system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "duckdb",
  "fastapi",
  "jinja2",
  "uvicorn[standard]",
  "python-multipart",
  "platformdirs",
  "pyxirr",
  "scipy",
  "click",
  "pyyaml",
  # `HttpPriceProvider` (adapters/market, ADR-0031) needs a real HTTP client at runtime.
  # Also doubles as starlette's TestClient dependency. C5 still forbids any HTTP client in
  # core or app; import-linter's check is a literal-name match against "httpx"/"requests",
  # and this package installs under the "httpx2" import name.
  "httpx2",
]

[project.scripts]
financeos = "financeos.cli:app"

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "import-linter",
  "hypothesis",
  "pytest",
  "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financeos"]

# --- Linting / formatting -----------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# docs/ holds the frozen RFC corpus; ruff format rewrites Python blocks inside
# that markdown, which would edit documents the corpus requires stay unchanged.
extend-exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# --- Type checking -------------------------------------------------------

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests"]

# --- Import architecture contracts (RFC-0005 §7) -------------------------
# C6 (append-only: no UPDATE/DELETE against append-only tables) and the positive half of C4
# ("only financeos.web may import adapters.duckdb.queries") are grep/AST scans, not
# import-graph contracts import-linter can express — enforced as real tests instead:
# tests/test_c6_append_only.py, tests/test_c4_read_write_split.py.

[tool.importlinter]
root_packages = ["financeos"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "C1 - core purity"
type = "forbidden"
source_modules = ["financeos.core"]
forbidden_modules = [
  "financeos.adapters",
  "financeos.web",
  "financeos.app",
  "duckdb",
  "fastapi",
  "pandas",
  "polars",
  "httpx",
  "httpx2",
  "requests",
]

[[tool.importlinter.contracts]]
name = "C2 - I-7 engines have no ports"
type = "forbidden"
source_modules = ["financeos.core.engines"]
forbidden_modules = ["financeos.ports"]

[[tool.importlinter.contracts]]
name = "C3 - context isolation"
type = "independence"
modules = [
  "financeos.core.cashflow",
  "financeos.core.portfolio",
  "financeos.core.strategy",
  "financeos.core.market",
  "financeos.core.decision",
]

[[tool.importlinter.contracts]]
name = "C4 - read/write split (queries forbidden from app)"
type = "forbidden"
source_modules = ["financeos.app"]
forbidden_modules = ["financeos.adapters.duckdb.queries"]

[[tool.importlinter.contracts]]
name = "C5 - no egress in core or app"
type = "forbidden"
source_modules = ["financeos.core", "financeos.app"]
# `httpx2` is listed because that is the real module name of the client
# `adapters/market/http_price_provider.py` imports (as `import httpx2 as httpx`).
# import-linter matches the imported module, not the alias, so a C5 that named
# only "httpx" could not see the one HTTP client this project actually ships.
forbidden_modules = ["httpx", "httpx2", "requests"]
