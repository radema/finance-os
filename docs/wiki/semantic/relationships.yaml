# Finance OS — flat relationship edge list
#
# One edge per line-group, so "what is the relationship between X and Y" is a single grep.
# Point-in-time map, base commit 2dd7346. Ground truth is docs/seed/rfcs/ then src/.
#
# QUERY RECIPES
#   grep -A4 'subject: Rule$'                 relationships.yaml   # every edge FROM Rule
#   grep -A4 'object: Recommendation$'        relationships.yaml   # every edge INTO Recommendation
#   grep -B1 -A3 'predicate: governs'         relationships.yaml   # every governance edge
#   grep -A4 'Rule' relationships.yaml | grep -A4 'Recommendation'  # the Rule->Recommendation path
#
# PREDICATE VOCABULARY (closed — do not invent one without adding it here)
#   owns              subject is the aggregate boundary containing object
#   belongs_to        inverse of owns
#   governs           subject's policy applies to object (Strategy -> Bucket)
#   governed_by       inverse of governs
#   produces          subject's evaluation yields object (1:1 unless cardinality says otherwise)
#   produced_by       inverse of produces
#   derived_from      object is the authored/stored truth; subject is computed and droppable
#   pins              subject stores an immutable reference that must never dangle
#   keyed_by          subject's identity or grouping is a hash/tuple over object
#   contains          document containment, NOT a foreign key
#   contract_between  subject is a DTO crossing the named context boundary
#   resolves          subject settles/closes object (Decision -> Finding)
#   consumed_by       subject is an input fact to object
#   gates             subject decides whether object runs
#   supersedes        append-only correction chain

schema_version: 1
base_commit: 2dd7346

edges:

  # --- ownership and governance -------------------------------------------------------

  - subject: Portfolio
    predicate: owns
    object: Bucket
    cardinality: 1..N
    mechanism: bucket.portfolio_id (non-nullable, ERR-9)
    authority: [RFC-0004 §2.2, RFC-0011 ERR-9]

  - subject: Portfolio
    predicate: owns
    object: Account
    cardinality: 0..N
    mechanism: portfolio_account link table
    authority: [RFC-0011 ERR-8]

  - subject: Strategy
    predicate: governs
    object: Bucket
    cardinality: 1..N
    mechanism: bucket.strategy_id (non-nullable, I-3)
    authority: [RFC-0007 §5, ADR-0020, I-3]
    note: >
      A Strategy is a POLICY, not a per-Bucket instance — SEVERAL Buckets may be governed by
      the same Strategy (ADR-0020). A Bucket is governed by EXACTLY ONE (I-3).

  - subject: Bucket
    predicate: governed_by
    object: Strategy
    cardinality: exactly 1
    mechanism: I-3
    authority: [RFC-0004 §6.1, I-3]

  - subject: Strategy
    predicate: owns
    object: StrategyVersion
    cardinality: 1..N
    mechanism: strategy_version.strategy_id; lineage via parent_version_id
    authority: [E2, RFC-0007 §7]

  - subject: Strategy
    predicate: pins
    object: StrategyVersion
    cardinality: 0..1
    mechanism: strategy.current_version_id — NO FK (mutually-referencing gap); repointed by UPDATE
    authority: [RFC-0011 ERR-8, I-22]
    note: >
      The ONLY mutable field on the Strategy aggregate. A CANDIDATE version is never the target
      of current_version_id (I-22, ADR-0035) — not implemented, lineage_kind does not exist yet.

  - subject: StrategyVersion
    predicate: supersedes
    object: StrategyVersion
    cardinality: 0..1
    mechanism: parent_version_id
    authority: [RFC-0007 §7]
    note: Lineage, so the history of the author's thinking is walkable.

  # --- the frozen document ------------------------------------------------------------

  - subject: StrategyVersion
    predicate: contains
    object: Rule
    cardinality: 1..N
    mechanism: strategy_version.definition JSON -> StrategyDefinition.rules — DOCUMENT CONTAINMENT, NO FK
    authority: [ADR-0027, I-4]
    note: >
      THE MOST MISREAD EDGE IN THE SYSTEM. There is NO `rule` table. alert.rule_id and
      recommendation.rule_id carry NO foreign key. A Rule is resolved by
      run_id -> strategy_version_id -> definition.rules, via StrategyDefinition.rule(), which
      raises RuleNotInVersionError. The integrity guarantee is that boundary check plus a
      property test — deliberately, not by omission.

  - subject: StrategyVersion
    predicate: contains
    object: TargetAllocation
    cardinality: exactly 1
    mechanism: definition.targets
    authority: [ADR-0017, RFC-0007 §2]

  - subject: Rule
    predicate: contains
    object: LeafCondition
    cardinality: exactly 1
    mechanism: rule.condition — a BARE LeafCondition, not a union with combinators
    authority: [RFC-0006 §2, ADR-0014]
    note: Combinators (depth 1) are specified in RFC-0006 §2.1 but NOT implemented.

  - subject: LeafCondition
    predicate: derived_from
    object: ConditionKindSpec
    cardinality: exactly 1
    mechanism: (kind, kind_version) lookup into REGISTRY
    authority: [ADR-0014, RFC-0006 §8]
    note: >
      Params validated against spec.params_model at AUTHORING time (app layer, on freeze), parsed
      by the engine at evaluation time — so core.strategy never imports the engine registry.

  - subject: TargetAllocation
    predicate: produces
    object: LeafTarget
    cardinality: 1..N
    mechanism: .leaves() — effective_target is the PRODUCT of weights along the root->leaf path
    authority: [ADR-0017, I-13]

  - subject: TargetNode
    predicate: keyed_by
    object: AssetClass
    cardinality: exactly 1
    mechanism: node.key
    authority: [I-14]
    note: NEVER an AssetId (I-14). RFC-0012 ADR-0033 restates this to (axis, value); not built.

  # --- facts: what the engines compute ------------------------------------------------

  - subject: Holding
    predicate: derived_from
    object: Operation
    cardinality: N..1
    mechanism: portfolio_engine.compute_holdings; SQL half is the mv_holding view
    authority: [ADR-0003]
    note: Computed, NEVER authored. Do not add a holding table.

  - subject: VirtualHolding
    predicate: derived_from
    object: ApportionmentRecord
    cardinality: N..1
    mechanism: fold of the supersession chain at as_of
    authority: [ADR-0025, E3]

  - subject: ApportionmentRecord
    predicate: supersedes
    object: ApportionmentRecord
    cardinality: 0..1
    mechanism: supersedes_id
    authority: [ADR-0011, RFC-0009 §7.1]
    note: >
      AUTHORED DATA. A superseded row is NOT noise — it is what the chain is reconstructed from.
      Only recovery path: `financeos export --authored`.

  - subject: AllocationBreakdown
    predicate: derived_from
    object: Holding
    cardinality: N..1
    mechanism: portfolio_engine.compute_allocation (needs PriceView to value)
    authority: [RFC-0004 §2.3]

  - subject: DriftComputation
    predicate: derived_from
    object: AllocationBreakdown
    cardinality: 1..1
    mechanism: strategy_engine.compute_drift(allocation, sv.targets, strategy_version_id=sv.id)
    authority: [RFC-0007 §4]
    note: >
      An INCOMPLETE breakdown (unpriced assets) is NOT consumed — the Strategy Engine SKIPs,
      because a partial denominator is forbidden (RFC-0007 §4.1).

  - subject: DriftLine
    predicate: consumed_by
    object: drift_outside_tolerance
    cardinality: N..1
    mechanism: FACT_DRIFT
    authority: [RFC-0006 §3.1, RFC-0007 §4]
    note: severity arrives PRE-COMPUTED. The rule engine performs no financial computation.

  - subject: LeafTarget
    predicate: consumed_by
    object: untargeted_allocation
    cardinality: N..1
    mechanism: FACT_TARGETS
    authority: [ADR-L05 §5]
    note: A separate family from FACT_DRIFT so discovery does not depend on drift being computable.

  - subject: AllocationLine
    predicate: consumed_by
    object: untargeted_allocation, allocation_absent
    cardinality: N..1
    mechanism: FACT_ALLOCATION
    authority: [RFC-0006 §3, RFC-0011 ERR-4]

  - subject: ResidualComputation
    predicate: consumed_by
    object: unassigned_residual_above
    cardinality: 1..1
    mechanism: FACT_RESIDUAL
    authority: [ADR-0029]

  - subject: ApportionmentLine
    predicate: consumed_by
    object: over_apportioned
    cardinality: N..1
    mechanism: FACT_APPORTIONMENT
    authority: [ADR-L04 §4.4 D5, ADR-0025, I-9]
    note: Over-apportionment (I-9) WARNS, NEVER BLOCKS.

  - subject: FactSet
    predicate: contract_between
    object: app/evaluate_strategy.py and rule_engine.evaluate
    cardinality: 1..1
    mechanism: frozen, fully materialized before the call
    authority: [RFC-0006 §4, RFC-0005 §3, I-7]
    note: >
      NO LAZY LOADING. Engines hold no repository (I-7), so the application service assembles
      every fact FIRST. app/evaluate_strategy.py is the ONE composition point.

  - subject: Bound
    predicate: contains
    object: SourceRef
    cardinality: exactly 1
    mechanism: required field, no default
    authority: [ADR-0004, RFC-0006 §4]
    note: A fact with no source CANNOT BE CONSTRUCTED — provenance is structural, not a habit.

  # --- evaluation: the core pipeline --------------------------------------------------

  - subject: RuleScopeGate
    predicate: gates
    object: Rule
    cardinality: 0..1
    mechanism: app/evaluate_strategy.py subsets sv.rules BEFORE calling RuleEngine.evaluate
    authority: [ADR-L06, RFC-0006 §3.1]
    note: >
      Read by the APPLICATION LAYER, never by the engine (C2). scope_gate=None means
      unconstrained (ADR-L06 §4.1 compatibility default); the app then falls back to inferring
      a gate from the condition kind. A LeafCondition's `scope` param is a MESSAGE BINDING and
      is never compared against the facts' actual scope.

  - subject: Rule
    predicate: produces
    object: RuleFiring
    cardinality: 1..1 per evaluation call it is gated into
    mechanism: rule_engine.evaluate, ordered (priority DESC, rule_id ASC)
    authority: [RFC-0006 §5, RFC-0008 §3]
    note: ALL FOUR outcomes travel. SKIPPED != NOT_FIRED (ADR-0016).

  - subject: RuleFiring
    predicate: contract_between
    object: strategy (producer) and decision (consumer)
    cardinality: 1..1
    mechanism: core/decision/firing.py — OWNED BY THE CONSUMING CONTEXT
    authority: [RFC-0004 §4.1, E5]
    note: Strategy hands over outcomes plus traces; it NEVER constructs a Recommendation.

  - subject: RuleFiring
    predicate: produces
    object: Alert
    cardinality: 1..1
    mechanism: decision_engine.materialize — ONE Alert per firing, WHATEVER the outcome
    authority: [E5, RFC-0008 §2]

  - subject: Alert
    predicate: contains
    object: EvaluationTrace
    cardinality: exactly 1
    mechanism: alert.trace JSON (ADR-0013)
    authority: [I-6, ADR-0013]
    note: >
      FIRED and NOT_FIRED require a bound, stepped trace — enforced by Alert's model validator.
      Stored traces are NEVER migrated: bump TRACE_VERSION and keep all readers (RFC-0009 §7.2).

  - subject: Alert
    predicate: produces
    object: Recommendation
    cardinality: 1..1 — FIRED ONLY, and ACTUAL runs only
    mechanism: decision_engine.materialize; recommendation.alert_id
    authority: [RFC-0008 §2, RFC-0008 §8, I-5]
    note: >
      THE ANSWER TO "what is the relationship between a Rule and a Recommendation": Rule ->
      RuleFiring -> Alert -> Recommendation. The Alert is the persisted middle term, and it is
      the step most often skipped when describing this chain. NOT_FIRED, SKIPPED and ERROR
      Alerts produce NO Recommendation. HYPOTHETICAL runs produce ZERO Recommendations even for
      FIRED alerts (RFC-0008 §8).

  - subject: Recommendation
    predicate: derived_from
    object: Rule
    cardinality: N..1
    mechanism: Provenance.rule_id + Provenance.run_id, both NON-NULLABLE
    authority: [I-5, RFC-0009 §4.2]
    note: >
      I-5 is STRUCTURAL: no construction path exists for a Recommendation that does not derive
      from a Rule, because Provenance cannot be built without both ids.

  - subject: Recommendation
    predicate: derived_from
    object: StrategyVersion
    cardinality: N..1
    mechanism: rationale is ASSEMBLED from the frozen definition, never authored per rule
    authority: [ADR-0023]
    note: >
      The MiFID suitability firewall as code: the only inputs to the rationale generator are the
      user's OWN frozen declarations, so no code path can assert that anything is suitable.

  - subject: EvaluationRun
    predicate: pins
    object: StrategyVersion
    cardinality: N..1
    mechanism: evaluation_run.strategy_version_id (a real FK)
    authority: [I-11, RFC-0011 ERR-6]
    note: >
      ONE JOIN AWAY from every Alert, so the I-11 pin can never dangle (ERR-6). This replaced
      RFC-0004's Alert.strategyVersion field.

  - subject: EvaluationRun
    predicate: owns
    object: Alert
    cardinality: 1..N
    mechanism: alert.run_id
    authority: [E4, RFC-0009 §3.2]

  - subject: EvaluationRun
    predicate: keyed_by
    object: Scope
    cardinality: exactly 1
    mechanism: evaluation_run.scope_kind + scope_id — scope_id has NO FK (it may be either entity)
    authority: [RFC-0011 ERR-2]

  - subject: Snapshot
    predicate: produced_by
    object: EvaluationRun
    cardinality: 1..1 per evaluate run
    mechanism: SHARED run_id
    authority: [RFC-0009 §5.1, RFC-0010 V1.0, I-16]
    note: >
      Sharing run_id makes "what did the Portfolio look like when this Recommendation appeared"
      a single JOIN. Immutable (I-16) but rebuildable and droppable — a checkpoint, not truth.

  # --- findings and resolution --------------------------------------------------------

  - subject: Recommendation
    predicate: keyed_by
    object: finding_key
    cardinality: N..1
    mechanism: sha256(rule_id ‖ scope_id ‖ canonical(condition.params)) — decision_engine.py:158
    authority: [RFC-0008 §4, RFC-0011 §4 R-2]
    note: >
      strategy_version_id is DELIBERATELY EXCLUDED, so editing an unrelated rule does not reset
      a finding's history. scope_id is included REDUNDANTLY on purpose (R-2).

  - subject: Finding
    predicate: derived_from
    object: Recommendation
    cardinality: 1..N
    mechanism: mv_finding, GROUP BY (finding_key, rule_id), WHERE run.mode = 'ACTUAL'
    authority: [ADR-0021, RFC-0008 §4]
    note: >
      DEDUP IS READ-SIDE. The Decision Engine deduplicates nothing — a mutable Recommendation
      would be a row whose run_id no longer identifies the run that produced its content.
      CORRELATED findings are never collapsed (RFC-0008 §4.1): equity-under and bonds-over stay
      two findings.

  - subject: Decision
    predicate: resolves
    object: Finding
    cardinality: N..1
    mechanism: finding_key — THE FULL KEY, never a prefix or a recommendation_id
    authority: [ADR-0022, RFC-0008 §7, RFC-0008 §7.1]
    status: SPECIFIED, NOT IMPLEMENTED at 2dd7346 (no Decision class, no decision table)
    danger: >
      Keying resolution on LESS than the full finding_key SILENTLY HIDES LIVE FINDINGS. THIS BUG
      HAS ALREADY SHIPPED ONCE. Guarded by
      tests/test_finding_resolution.py::test_editing_rule_params_does_not_resolve_an_unrelated_finding.

  - subject: Decision
    predicate: references
    object: Recommendation
    cardinality: 0..N
    mechanism: informedBy — MAY BE EMPTY (RFC-0008 §7.2)
    authority: [RFC-0004 §7, ADR-0002, I-17]
    status: SPECIFIED, NOT IMPLEMENTED
    note: >
      I-17 forbids the REVERSE edge: a Recommendation cannot reference a Decision. Dismissal is
      recorded as a Decision — nothing is mutated, and there is NO `dismissed` flag (ADR-0022).

  - subject: Decision
    predicate: references
    object: Operation
    cardinality: 0..N
    mechanism: enactedBy (RFC-0008 §7.3)
    authority: [RFC-0008 §7.3]
    status: SPECIFIED, NOT IMPLEMENTED

  # --- market -------------------------------------------------------------------------

  - subject: PriceView
    predicate: contract_between
    object: market (owner) and portfolio (consumer)
    cardinality: N..1
    mechanism: flat DTO; Portfolio NEVER queries the price table
    authority: [ADR-0031, E11, RFC-0005 §5.7]
    note: >
      Market owns EVERY external observation, prices included, so egress lives behind ONE
      context (Privacy First). The (valid_date, recorded_at) bitemporal pair lets a later
      discrepancy be explained as a RESTATEMENT.

  - subject: Asset
    predicate: keyed_by
    object: AssetClass
    cardinality: N..1
    mechanism: asset.asset_class VARCHAR, mutable in place (ADR-0012)
    authority: [ADR-0012, I-14, I-20]
    note: >
      A reclassification must be accompanied by an asset_classification_audit row (E6) — a
      REPOSITORY concern, not a model validator. RFC-0012 ADR-0033 makes this per-axis with
      fractional weights; NOT built.

  # --- architecture edges (enforced, not aspirational) --------------------------------

  - subject: core.cashflow, core.portfolio, core.strategy, core.market, core.decision
    predicate: contract_between
    object: each other — FORBIDDEN
    cardinality: n/a
    mechanism: import-linter contract C3 (type = independence)
    authority: [RFC-0004 §4, RFC-0005 §4, C3]
    note: >
      SIBLING CONTEXTS MAY NOT IMPORT EACH OTHER. core/shared/ is the ONLY shared vocabulary.
      Consequences you will actually meet: AssetClass lives in core/shared (not core/portfolio)
      so I-14 is enforceable without an import edge; Snapshot uses MoneyAmount/WeightAmount
      rather than core.portfolio's Money/AllocationLine; RuleFiring lives in core/decision even
      though core/strategy produces it. Where a shape must cross, it crosses as a DTO owned by
      the CONSUMING context, or as shared-kernel vocabulary.

  - subject: core.engines
    predicate: contract_between
    object: ports — FORBIDDEN
    cardinality: n/a
    mechanism: import-linter contract C2 (forbidden)
    authority: [I-7, C2, RFC-0005 §3]
    note: >
      NO ENGINE HOLDS A PORT, so no engine can write to storage or read a clock (I-7). Every
      engine is a pure function. NO ENGINE CALLS ANOTHER ENGINE — composition happens in exactly
      one place, an app/ use case. Ports are a SIBLING of core, not inside it, to keep the graph
      acyclic.

  - subject: adapters.duckdb.queries
    predicate: contract_between
    object: web ONLY
    cardinality: n/a
    mechanism: import-linter C4 (app may not import queries) + tests/test_c4_read_write_split.py (positive half)
    authority: [C4, RFC-0005 §2]
    note: >
      The read side returns NON-DOMAIN DTOs and is importable only by web/. Never inline SQL in
      a route. Two shapes over one DuckDB file: hexagonal on the WRITE side, dataflow SQL on the
      READ side.
