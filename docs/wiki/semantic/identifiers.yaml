# Finance OS — identifier-family index
#
# Every named identifier family in the corpus, what it means, where its registry lives, and
# what it constrains. Point-in-time map, base commit 2dd7346.
#
# QUERY RECIPES
#   grep -A6 '^ *- id: I-12$'          identifiers.yaml   # one identifier
#   grep -A8 '^- family: I$'           identifiers.yaml   # a family's header (registry location)
#   grep -n  '^ *- id: '               identifiers.yaml   # every identifier, with line numbers
#   grep -B4 'finding_key'             identifiers.yaml   # which identifiers touch a concept
#
# Note: member records are indented 4 spaces (`    - id: I-12`). The recipes above use `^ *-`
# so they keep working if nesting depth ever changes.
#
# CITE THE NUMBER, DO NOT PARAPHRASE. Statements below are trimmed for indexing; the registry
# location named in each family header is normative.

schema_version: 1
base_commit: 2dd7346

# =====================================================================================
families:

# -------------------------------------------------------------------------------------
- family: I
  name: Invariants
  range: I-1 .. I-22
  registry: docs/seed/rfcs/RFC-0000-index.md §6
  registry_caveat: >
    RFC-0000 §6 lists ONLY I-1..I-18. I-19..I-22 were added by RFC-0012 §4, which also RESTATES
    I-14; RFC-0000 was never updated on disk. This is a live staleness the corpus flags through
    its own precedence mechanism. CLAUDE.md's "I-1..I-18" reflects RFC-0000, not the current set.
  defined_in: RFC-0004 §6.1 (from RFC-0003) and §6.2 (added), plus RFC-0012 §4 (deltas)
  enforcement: mixed — model validators, repository checks, import-linter, named property tests
  members:
    - id: I-1
      statement: A Holding belongs to exactly one Asset.
      constrains: [Holding, Asset]
      enforced_by: Holding.asset_id (single field)
    - id: I-2
      statement: An Asset may belong to many Buckets.
      constrains: [Asset, Bucket, VirtualHolding]
      enforced_by: bucket_apportionment (many rows per asset)
    - id: I-3
      statement: A Bucket is governed by exactly one Strategy.
      constrains: [Bucket, Strategy]
      enforced_by: bucket.strategy_id non-nullable (ERR-9)
      note: >
        This is what makes SkipReason.HETEROGENEOUS_STRATEGIES necessary: each Bucket has one
        Strategy, so a PORTFOLIO-scope evaluation over Buckets with different StrategyVersions
        has no single target tree to resolve. Never averaged (RFC-0007 §5).
    - id: I-4
      statement: A Strategy contains at least one Rule.
      constrains: [StrategyDefinition, Rule]
      enforced_by: StrategyDefinition._at_least_one_rule (core/strategy/strategy.py:97)
    - id: I-5
      statement: Every Recommendation derives from a Rule.
      constrains: [Recommendation, Provenance, Rule]
      enforced_by: >
        Provenance.rule_id and .run_id are NON-NULLABLE — structural, no construction path exists
        for a Recommendation without a Rule (core/decision/artifacts.py:102).
    - id: I-6
      statement: Every Alert is explainable — replayable back to the numbers that produced it.
      constrains: [Alert, EvaluationTrace, TraceRecorder]
      enforced_by: >
        Alert._is_explainable (artifacts.py:87) requires a bound, stepped trace for FIRED and
        NOT_FIRED; the TraceRecorder makes the trace ACCUMULATED not emitted, so no untraced
        arithmetic path exists. Verified by tests/test_trace_replay.py.
    - id: I-7
      statement: No engine writes to storage.
      constrains: [core.engines, FactSet, Bound]
      enforced_by: >
        import-linter contract C2 (core.engines may not import financeos.ports). Consequences:
        no lazy fact loading, no Clock in the core, ages measured against the run's as_of.
    - id: I-8
      statement: All mutations pass through the domain.
      constrains: [adapters, app]
      enforced_by: repository layer; no raw-SQL write path outside adapters
    - id: I-9
      statement: >
        Per Asset at any as_of, Σ apportioned <= Holding; a violation is REPORTABLE, not
        rejectable.
      constrains: [ApportionmentLine, ApportionmentRecord, ResidualComputation, over_apportioned]
      revised_by: ADR-0025 (from a rejection rule to an evaluation-time finding)
      enforced_by: the over_apportioned condition kind
      note: OVER-APPORTIONMENT WARNS, NEVER BLOCKS. Looks like a bug; is deliberate.
    - id: I-10
      statement: Operations are append-only; corrections compensate.
      constrains: [Operation, ApportionmentRecord, Alert, Recommendation, EvaluationRun]
      revised_by: RFC-0005 §5.2 (enforcement), ADR-0028 (CORRECTION type)
      enforced_by: >
        contract C6 — tests/test_c6_append_only.py::test_no_update_or_delete_against_append_only_tables
        and ::test_append_only_table_list_matches_migration_001; plus
        tests/test_operation_repository_invariants.py::test_w10_the_repository_exposes_no_update_or_delete_method
    - id: I-11
      statement: Every Alert pins (strategy, version, rule) plus its inputs.
      constrains: [Alert, EvaluationRun, StrategyVersion]
      revised_by: RFC-0011 ERR-6 (wording — the pin moved to EvaluationRun)
      enforced_by: >
        evaluation_run.strategy_version_id FK, one join from every Alert, so the pin cannot dangle.
    - id: I-12
      statement: A Recommendation is never prescriptive.
      constrains: [Recommendation, SuggestionClass]
      enforced_by: >
        STRUCTURAL — there is no instrument, action, direction or quantity field to populate, and
        no SuggestionClass member can carry one. Verified by tests/test_i12_structural.py.
      note: The MiFID suitability firewall expressed as a SCHEMA rather than as a policy.
    - id: I-13
      statement: The children of every target-tree node sum to 1 within an explicit Decimal epsilon.
      constrains: [TargetAllocation, TargetNode]
      revised_by: ADR-0017 (hierarchical, relative weights), RFC-0011 ERR-5
      enforced_by: >
        _check_sum_to_one against WEIGHT_SUM_EPSILON, in the CONSTRUCTOR
        (core/strategy/targets.py:113). Effective leaf targets therefore sum to 1 BY
        CONSTRUCTION — there is no separate global check, and adding one would be redundant.
    - id: I-14
      statement: Targets are keyed by AssetClass, never by AssetId.
      constrains: [TargetNode, LeafTarget, AssetClass]
      revised_by: RFC-0012 §4 / ADR-0033 (restated to (axis, value) pairs — NOT IMPLEMENTED)
      rescoped_by: RFC-0012 ERR-14 (the "no AssetId" claim applies to target/drift conditions, not per-asset ones)
      enforced_by: TargetNode.key is typed AssetClass
      note: >
        ERR-14 matters: over_apportioned already keys facts by AssetId, and that is NOT a
        violation — I-14 governs the TARGET TREE, not every condition.
    - id: I-15
      statement: Money arithmetic requires the same currency.
      constrains: [Money]
      enforced_by: CurrencyMismatchError, core/shared/money.py
    - id: I-16
      statement: Snapshot and IndicatorReading are immutable.
      constrains: [Snapshot, IndicatorReading]
      enforced_by: frozen DomainModel; snapshot rows written once per evaluate run
      note: Immutable but REBUILDABLE and DROPPABLE — a checkpoint, not a source of truth.
    - id: I-17
      statement: A Recommendation cannot reference a Decision.
      constrains: [Recommendation, Decision]
      enforced_by: absence of the field — the edge points Decision -> Recommendation only
    - id: I-18
      statement: The category hierarchy is acyclic.
      constrains: [AssetClass, ClassificationAxis]
      enforced_by: not yet — no category hierarchy type exists (V1.2)
    - id: I-19
      statement: Per Asset per axis, classification weights sum to 1 within an explicit Decimal epsilon.
      added_by: RFC-0012 §4 (ADR-0033)
      constrains: [ClassificationAxis]
      enforced_by: NOT IMPLEMENTED — trivially satisfied today (one axis, every weight 1)
    - id: I-20
      statement: Every Asset carries a classification on the ASSET_CLASS axis.
      added_by: RFC-0012 §4 (ADR-0033)
      constrains: [Asset, AssetClass]
      enforced_by: asset.asset_class NOT NULL (the degenerate single-axis case)
    - id: I-21
      statement: Every registered condition_kind declares its epistemic class (A/B/C).
      added_by: RFC-0012 §4 (originates in RFC-0010 ADR-0032)
      constrains: [ConditionKindSpec]
      enforced_by: NOT IMPLEMENTED — ConditionKindSpec has no epistemic-class field
    - id: I-22
      statement: A CANDIDATE strategy_version is never referenced by strategy.current_version_id.
      added_by: RFC-0012 §4 (ADR-0035)
      constrains: [Strategy, StrategyVersion]
      enforced_by: NOT IMPLEMENTED — lineage_kind does not exist yet
      note: >
        When built, this is the SECOND of two independent guards keeping a candidate out of the
        findings list; the first is RunMode.HYPOTHETICAL producing zero Recommendations.

# -------------------------------------------------------------------------------------
- family: C
  name: Architecture contracts
  range: C1 .. C6
  registry: pyproject.toml [tool.importlinter] (C1-C5) + tests/ (C4 positive half, C6)
  enforcement: "`uv run lint-imports` for C1-C5; pytest for C4's positive half and C6"
  members:
    - id: C1
      statement: Core purity — core may not import adapters, web, app, duckdb, fastapi, pandas, polars, or any HTTP client.
      type: import-linter forbidden
      constrains: [core]
      note: Zero I/O, zero framework, Decimal only. float is BANNED (FloatNotAllowedError).
    - id: C2
      statement: core.engines may not import financeos.ports (I-7 made structural).
      type: import-linter forbidden
      constrains: [core.engines]
      note: >
        This is why FactSet must be fully materialized, why next_id is passed as a VALUE into
        decision_engine.materialize, and why RuleScopeGate is read by app/ not by the engine.
    - id: C3
      statement: >
        The five bounded contexts (cashflow, portfolio, strategy, market, decision) are mutually
        independent — no sibling may import another.
      type: import-linter independence
      constrains: [core.cashflow, core.portfolio, core.strategy, core.market, core.decision]
      note: >
        core/shared/ is the ONLY shared vocabulary. This is ARCHITECTURALLY LOAD-BEARING and
        explains several placements that otherwise look arbitrary — see
        ../ontology/bounded-contexts.md.
    - id: C4
      statement: >
        Read/write split — app may not import adapters.duckdb.queries; only web may import them.
      type: import-linter forbidden (negative half) + test (positive half)
      constrains: [app, adapters.duckdb.queries, web]
      enforced_by: tests/test_c4_read_write_split.py::test_only_web_imports_the_read_side_query_modules
    - id: C5
      statement: No egress in core or app — httpx, httpx2, requests are forbidden.
      type: import-linter forbidden
      constrains: [core, app]
      note: >
        httpx2 is listed BECAUSE that is the real module name adapters/market/http_price_provider.py
        imports (`import httpx2 as httpx`). import-linter matches the imported module, not the
        alias, so a C5 naming only "httpx" could not see the one HTTP client this project ships.
    - id: C6
      statement: No UPDATE or DELETE against append-only tables.
      type: test only — NOT an import-linter contract
      constrains: [operation, bucket_apportionment, price, evaluation_run, alert, recommendation, strategy_version]
      enforced_by: tests/test_c6_append_only.py
      note: >
        The table list itself is pinned by
        test_append_only_table_list_matches_migration_001, so adding an append-only table without
        registering it fails the suite.

