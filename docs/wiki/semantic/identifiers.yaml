- family: ADR-L
  name: Local architecture decision records (build blockers)
  range: ADR-L01 .. ADR-L08
  registry: docs/plans/adr/
  distinction: >
    A SEPARATE SERIES from corpus ADRs. Local ADRs resolve BUILD blockers the frozen corpus does
    not decide. They may override a corpus ADR's clause where the corpus is silent or wrong in
    practice — cite both when they do (e.g. "overrides ADR-0025's severity clause").
  members:
    - id: ADR-L01
      title: "`operation` link-flag truth table: corrects_id x transfer_pair_id x cash_leg_of"
      file: docs/plans/adr/ADR-L01-operation-flags-truth-table.md
      constrains: [Operation]
      note: The row-local rules Operation's validator and 001_init.sql's CHECKs both encode.
    - id: ADR-L02
      title: "Severity declarations for unassigned_residual_above, allocation_absent, bucket_below_target_value"
      file: docs/plans/adr/ADR-L02-severity-declarations.md
      constrains: [SeverityDeclaration]
    - id: ADR-L03
      title: "Charting library (ECharts, vendored) and UI language (Italian copy, English code)"
      file: docs/plans/adr/ADR-L03-chart-lib-and-ui-language.md
      constrains: [web]
      note: ECharts and htmx are VENDORED — no CDN. Chart colours are "token:--name", never literals.
    - id: ADR-L04
      title: "over_apportioned severity under the uniform anchor"
      file: docs/plans/adr/ADR-L04-over-apportioned-severity.md
      constrains: [over_apportioned, ApportionmentLine]
      note: §4.4 D5 is why ApportionmentLine asserts apportioned_quantity > 0 in the MODEL.
    - id: ADR-L05
      title: "untargeted_allocation reduction over multiple classes"
      file: docs/plans/adr/ADR-L05-untargeted-allocation-reduction.md
      constrains: [untargeted_allocation, FACT_TARGETS, core/shared/labels.py]
      note: §5 is why FACT_TARGETS exists separately from FACT_DRIFT. See also L05 label registry.
    - id: ADR-L06
      title: "Rule scope gating: which evaluation call a Rule applies to"
      file: docs/plans/adr/ADR-L06-rule-scope-gating.md
      constrains: [RuleScopeGate, app/evaluate_strategy.py, SkipReason.HETEROGENEOUS_STRATEGIES]
      note: The newest decision at 2dd7346. §4.1 sets scope_gate=None as the compatibility default.
    - id: ADR-L07
      title: "zero_portfolio_value also gates the allocation fact family"
      file: docs/plans/adr/ADR-L07-zero-portfolio-value-gates-allocation.md
      constrains: [FACT_ALLOCATION, app/evaluate_strategy.py, untargeted_allocation, allocation_absent]
      note: >
        Extends ADR-L06 §7.1's precedent to the zero-portfolio-value branch; the MISSING_FACT
        (partial) case is deliberately untouched. Built for the UX-0001 §8.5 demo fixture.
    - id: ADR-L08
      title: "`/dashboard`: a second landing page, alongside `/`, not instead of it"
      file: docs/plans/adr/ADR-L08-dashboard-landing-page.md
      constrains: [web/routes/dashboard.py, web]
      note: >
        Variation C, «Il patrimonio annotato» (task #12). UX-0001 §5.3 is now a pointer to this
        ADR; `/` is untouched.

