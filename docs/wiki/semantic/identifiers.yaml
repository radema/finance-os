# =====================================================================================
# GOVERNANCE RULES THAT ARE NOT AN IDENTIFIER FAMILY BUT GOVERN ALL OF THEM
# =====================================================================================

governance:
  corpus_is_normative: >
    docs/seed/rfcs/ is the specification and it OUTRANKS THE CODE. When they disagree, THE CODE IS
    WRONG. Read the relevant RFC section before changing behaviour and cite it in the commit.

  rfcs_are_never_edited_in_place: >
    A correction is a NEW AMENDING DOCUMENT plus a row in RFC-0000-index.md §4. docs/seed/ is
    READ-ONLY to an implementer. RFC-0000 §4 is the practical lookup table of what corrects what.

  precedence: >
    SECTION-SCOPED AND RECENCY-ORDERED (RFC-0012 §8), NOT document-scoped. RFC-0011's earlier
    "this document wins" claim was found self-contradictory and replaced via ERR-15 — the corpus
    documents its own governance bug and fixes it in-band. Practical consequence: to resolve a
    conflict, find the LATEST document that speaks to THAT SECTION, not the latest document
    overall.

  two_adr_series: >
    Corpus ADRs 0001-0036 live inside their owning RFC's Appendix A. LOCAL ADRs (ADR-L01...) live
    in docs/plans/adr/ and resolve build blockers. Do not merge the numbering.

  ux_mock_is_non_normative: >
    docs/seed/ux/UX-0001-ui-reference.md is NON-NORMATIVE. If it drifts from the corpus, THE CORPUS
    WINS. Same for docs/seed/ux/finance-os-ui-mock.html.

  product_definition_questions: >
    PRODUCT-DEFINITION QUESTIONS GO TO THE PRODUCT OWNER. AN AGENT NEVER INVENTS ONE. If a
    behaviour is undecided, the answer is to ask, not to pick a default and ship it.

  session_ledger: >
    docs/handoff/HANDOFF-<date>.md is the session ledger — read the most recent before resuming.
    It records what is UNREVIEWED, what is DELIBERATELY UNFINISHED, and what LOOKS LIKE A BUG BUT
    ISN'T.
