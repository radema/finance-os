- family: P
  name: Product-owner ratifications
  range: P1 .. P33
  registry_split:
    - P1..P15: docs/handoff/HANDOFF-2026-07-26.md §(ratifications table)
    - P16..P20: docs/handoff/HANDOFF-2026-07-28.md §2.1
    - P21..P33: docs/plans/RATIFICATIONS-2026-07-30.md
  enforcement: convention + review; a few have code consequences (P31/P32 on RiskLevel)
  rule: >
    PRODUCT-DEFINITION QUESTIONS GO TO THE PRODUCT OWNER. AN AGENT NEVER INVENTS ONE. These are
    ratified decisions, not implementer defaults — cite the number where the wording or scale is
    quoted.
  members_of_note:
    - id: P1
      statement: Scope is S + V1.0; V1.1-V1.3 are sketched only, not built.
    - id: P2
      statement: UI language Italian for user-facing copy, English for code objects and identifiers.
      note: Overrides UX-0001 §6.1's provisional English. See also ADR-L03.
    - id: P5
      statement: Method is direct orchestration against the RFCs — no Speckit scaffold.
      note: The RFCs already ARE the spec. Do not initialize .specify/ here.
    - id: P7
      statement: Provenance carrier requirement (Recommendation records what it was produced from).
      constrains: [Provenance]
    - id: P10
      statement: No brand constraint — independent identity; OpenEconomics brand skills deliberately NOT applied.
    - id: P14
      statement: Decimals are STORED with a dot and LOCALIZED in the view.
      constrains: [Money, adapters/duckdb/queries/it_locale.py]
    - id: P17
      statement: Impersonal register for all Italian copy — "La strategia richiede...", never "La tua strategia".
      constrains: [all user-facing copy, core/shared/labels.py]
    - id: P18
      statement: Use `target`, not `obiettivo`.
    - id: P19
      statement: Asset-class heads render as Italian PROSE forms (le Azioni dei paesi sviluppati).
      constrains: [core/shared/labels.py]
      note: This is what makes L05's grammatical-agreement machinery worth building.
    - id: P20
      statement: demo/ fixture data is Italianised; instrument names stay as they really are.
    - id: P21
      statement: SuggestionClass surface forms are impersonal infinitives, per L05 §5.7 VERBATIM.
      constrains: [SuggestionClass]
      note: None names an instrument, direction or size (I-12, E7).
    - id: P22
      statement: Skip-reason labels and teaching glosses per L05 §5.6 verbatim, incl. heterogeneous_strategies.
      constrains: [SkipReason]
    - id: P23
      statement: Asset-class `short` forms per L05 §5.2 verbatim.
      note: Used ONLY in non-syntactic positions (axis, legend, cell, rail).
    - id: P24
      statement: Chart-axis taxonomy heads render as Italian SHORT forms, not English.
    - id: P25
      statement: Capitalisation — head noun capitalised, qualifiers lowercase; capitals appear mid-sentence BY DESIGN.
    - id: P26
      statement: UNASSIGNED surface is "Capitale non assegnato", short "Non assegnato".
      constrains: [Snapshot.by_bucket, ResidualComputation]
    - id: P27
      statement: '"non targettizzato" (a calque) replaced by "non compreso nella strategia", short "senza target".'
    - id: P28
      statement: >
        Instrument naming — frame noun `posizione` carries agreement; instrument names are opaque
        proper nouns quoted in «...», never inflected; full name + ISIN where one exists.
      note: The discriminator is a DECLARED asset field, never inferred from id-string shape.
    - id: P29
      statement: over_apportioned is reported PER-SCOPE, not per-asset, for V1.0.
      constrains: [over_apportioned]
    - id: P30
      statement: untargeted_allocation's threshold_weight <= 0 is REJECTED AT IMPORT TIME, not skipped at runtime.
      constrains: [UntargetedAllocationParams]
    - id: P31
      statement: >
        RiskLevel is the ordinal 1-7 UCITS KIID (SRRI) / PRIIPs KID (SRI) scale — NOT the invented
        5-member enum. Owner-declared, expressed on the regulatory scale.
      constrains: [RiskLevel]
      note: >
        This codebase does NOT compute SRRI/SRI from volatility or risk bands, and no field,
        docstring, ADR line or UI string may imply otherwise. The gloss is WITHDRAWN.
    - id: P32
      statement: RiskLevel's seven steps are named, with Italian surface forms; members keep English identifiers.
      constrains: [RiskLevel, risk_level_rank]
    - id: P33
      statement: A COMPUTED portfolio/bucket risk level is a separate feature, OUT of V1.0.
      note: >
        The declared profile is an input the system RESTATES; a computed level is arithmetic
        performed against it, and collapsing them would let a computed number overwrite a user
        declaration. Recorded at docs/features-candidates/portfolio-risk-level.md.

