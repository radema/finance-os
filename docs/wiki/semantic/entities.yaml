    - points_at: StrategyVersion (current_version_id — the only MUTABLE field, repointed by UPDATE)
    - governs: Bucket (many — a policy applied per Bucket, ADR-0020)
  relations_note: AUTHORED DATA — no recovery path but `financeos export --authored`.
  notes: >
    Identity and name ONLY. Every frozen copy of targets/tolerances/rules/horizon/risk lives in
    StrategyVersion.definition (ERR-8, ADR-0027). A Strategy is a POLICY, not a per-Bucket
