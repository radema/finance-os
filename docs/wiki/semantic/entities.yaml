    - references: Account (many, via portfolio_account link table)
    - checkpointed_by: Snapshot
  notes: >
    Deliberately thin — it does NOT contain Holdings. Holdings are derived (ADR-0003).
    A Portfolio is a set of Accounts in scope, nothing more.

- entity: Bucket
  context: portfolio
  classification: aggregate_root
  code: src/financeos/core/portfolio/portfolio.py:17
