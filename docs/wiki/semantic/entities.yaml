    - total_value: Money
    - unassigned_value: Money        # SIGNED — may be negative
    - residual_weight: WeightAmount | None
    - unavailable: SkipReason | None
    - input_refs: tuple[str, ...]
  relations:
    - consumed_by: unassigned_residual_above (FACT_RESIDUAL)
  notes: >
    The UNASSIGNED pseudo-bucket, valued Portfolio-wide. unassigned_value may legitimately be
    NEGATIVE when Σ apportioned exceeds a Holding (I-9, over_apportioned's territory) — a
    deficit, not a defect. Untargeted and unassigned capital STAYS in the denominator
    (ADR-0029); the resulting scatter of small under-allocation findings is the honest reading.

