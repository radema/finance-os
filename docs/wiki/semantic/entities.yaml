    compute SRRI/SRI from volatility or risk bands, and no field, docstring or UI string may
    imply otherwise. A COMPUTED portfolio risk level is a separate out-of-V1.0 feature (P33).
    StrEnum cannot carry the ordinal, hence risk_level_rank() (mirrors priority_rank()).

- entity: RiskProfile
  context: strategy
  classification: value_object
  code: src/financeos/core/strategy/strategy.py:74
  table: null
  authority: [P31, P32]
  invariants: []
  attributes:
