- entity: Operation
  context: portfolio
  classification: aggregate_root
  code: src/financeos/core/portfolio/operation.py:53
  table: operation
  authority: [RFC-0004 §2.2, RFC-0009 §3.1, ADR-0011, ADR-0026, ADR-0028, ADR-L01]
  invariants: [I-8, I-10, C6]
  attributes:
