  notes: >
    TRANSFER is deliberately ABSENT. A transfer is two-sided by nature and is represented as
    a TRANSFER_OUT/TRANSFER_IN pair sharing one transfer_pair_id. Do not add TRANSFER.

- entity: Holding
  context: portfolio
  classification: derived_read_model
  code: src/financeos/core/portfolio/holding.py:27
