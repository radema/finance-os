    - consumed_by: over_apportioned (FACT_APPORTIONMENT)
  notes: >
    One asset's Σ apportionment folded across every Bucket, paired against the Portfolio-wide
    Holding — the two operands I-9's predicate compares. apportioned_quantity > 0 is asserted
    by the MODEL, not only by the producer: it is what makes over_apportioned's severity
    denominator (Σ apportioned_quantity) provably non-zero on the firing set.

- entity: AllocationLine
  context: portfolio
  classification: derived_read_model
  code: src/financeos/core/portfolio/holding.py:53
  table: null
  authority: [RFC-0004 §2.1]
