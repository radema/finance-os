# Finance OS — machine-readable entity index
#
# Point-in-time map, base commit 2dd7346. Ground truth is docs/seed/rfcs/ (frozen corpus)
# then src/. If this file disagrees with either, this file is wrong. See ../README.md.
#
# QUERY RECIPES
#   grep -A30 '^- entity: Rule$'            entities.yaml   # one entity's full record
#   grep -n  '^- entity:'                   entities.yaml   # every entity, with line numbers
#   grep -B2 -A2 'I-12'                     entities.yaml   # what an invariant constrains
#   grep -A30 '^- entity:' entities.yaml | grep -E '^\s+context: strategy' -B8
#
# FIELD CONTRACT (every record carries all of these; `null` is used, never omission)
#   entity          PascalCase type name as it appears in code, or the SQL object name
#   context         cashflow | portfolio | strategy | market | decision | shared | engine | read_side
#   classification  aggregate_root | entity | value_object | derived_read_model | contract_dto
#                   | engine_artifact | enum | sql_view | not_implemented
#   code            path:line of the defining class, or null when nothing defines it
#   table           persisted DuckDB object, or null when the entity has no relational identity
#   authority       RFC sections and ADRs that specify it; first item is the primary definition
#   invariants      I-* / C-* ids this entity is constrained by
#   attributes      field: type, as declared
#   relations       predicate: object — see relationships.yaml for the flat edge list
#   notes           what a future agent gets wrong if it only reads the field list

schema_version: 1
base_commit: 2dd7346
generated_from:
  - docs/seed/rfcs/            # normative
  - src/financeos/             # implementation
  - docs/plans/adr/            # local ADRs (ADR-L01..L06)

# The sequence below sits at column 0 by design — `grep -A30 '^- entity: Rule$'` must work.
entities:

