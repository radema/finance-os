  relations:
    - authored_on: Rule
    - copied_to: Recommendation
  notes: >
    A CATEGORY OF DELIBERATION — never a transaction (E7, I-12). NO MEMBER CAN CARRY an
    instrument, a direction or a size, which is what makes a prescriptive Recommendation
    UNREPRESENTABLE rather than merely discouraged. Italian surface forms are impersonal
