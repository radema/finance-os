- entity: FactSet
  context: engine
  classification: engine_artifact
  code: src/financeos/core/engines/rule_engine.py:112
  table: null
  authority: [RFC-0006 §4, RFC-0005 §3, ADR-0016, ADR-L05 §5]
  invariants: [I-7]
  attributes:
    - as_of: date
    - scope: Scope
    - drift: Mapping[AssetClass, Bound[DriftLine]]
    - allocation: Mapping[AssetClass, Bound[AllocationLine]]
    - targets: Mapping[AssetClass, Bound[LeafTarget]]
    - residual: Bound[WeightAmount] | None
    - bucket_value: Bound[Money] | None
    - apportionment: Mapping[AssetId, Bound[ApportionmentLine]]
    - unavailable: Mapping[str, SkipReason]      # family name -> why it could not be computed
    - labels: Mapping[AssetClass, str]
    - asset_labels: Mapping[AssetId, str]
  fact_families:
    - drift: FACT_DRIFT (rule_engine.py:76) — targeted leaves only
    - allocation: FACT_ALLOCATION (rule_engine.py:80) — every HELD class, targeted or not
    - residual: FACT_RESIDUAL (rule_engine.py:84) — UNASSIGNED weight, Portfolio-scoped by nature
    - targets: FACT_TARGETS (rule_engine.py:90) — resolved leaves, independent of drift
    - bucket_value: FACT_BUCKET_VALUE (rule_engine.py:96) — scope total (ERR-4 removed a phantom `prices` fact)
    - apportionment: FACT_APPORTIONMENT (rule_engine.py:100) — committed units per Asset
  relations:
    - assembled_by: app/evaluate_strategy.py (the ONLY composition point, RFC-0005 §3)
    - consumed_by: rule_engine.evaluate
  notes: >
    FROZEN and FULLY MATERIALIZED. NO LAZY LOADING IS POSSIBLE — engines hold no repository
    (I-7) — so the application service assembles everything FIRST. `unavailable` carries a
    whole family's failure reason to the trace, so a rule that could not be evaluated never
    reads as NOT_FIRED (ADR-0016). THE RULE ENGINE PERFORMS NO FINANCIAL COMPUTATION: a new
    fact must carry something ANOTHER engine already computed (RFC-0006 §3.1).

- entity: ConditionKindSpec
  context: engine
  classification: engine_artifact
  code: src/financeos/core/engines/rule_engine.py:562
  table: null
  authority: [ADR-0014, RFC-0006 §3, RFC-0006 §12, RFC-0011 ERR-10, ADR-L02, L05 §7.3]
  invariants: [I-21]
  attributes:
    - kind: str
    - kind_version: int
    - params_model: type[BaseModel]      # validated at AUTHORING time, on freeze
    - required_facts: frozenset[str]     # must be non-empty
    - default_max_staleness: timedelta | None   # 8th component, added by ERR-10
    - severity: SeverityDeclaration
    - explanation_template: str
    - numeric_bindings: frozenset[str]   # DECLARED, never inferred (L05 §7.3, C-L05-3)
    - evaluate: Callable[[P, FactSet, TraceRecorder], ConditionResult]
  relations:
    - registered_in: ConditionRegistry (REGISTRY at rule_engine.py:637)
    - referenced_by: LeafCondition (kind + kind_version)
  notes: >
    Every field is REQUIRED, so omitting any registration component is a CONSTRUCTION FAILURE —
    RFC-0006 §12's completeness test enforced by the type system as well as by a test.
    numeric_bindings is declared rather than inferred because a naming convention silently
    misses a future binding, and regexing the stored VALUE would happily "localise" an ISIN.

- entity: ConditionRegistry
  context: engine
  classification: engine_artifact
  code: src/financeos/core/engines/rule_engine.py:600
  table: null
  authority: [ADR-0014, RFC-0006 §8]
  invariants: []
  attributes:
    - keyed_by: (kind, kind_version)
    - singleton: REGISTRY at src/financeos/core/engines/rule_engine.py:637
  relations:
    - holds: ConditionKindSpec
    - injectable_into: rule_engine.evaluate (so a test can register a kind)
  notes: >
    THE CLOSED CATALOG. Adding a kind is a CODE CHANGE, deliberately (ADR-0014). Re-registering
    the same (kind, kind_version) raises RegistryError: a kind's semantics NEVER change — a new
    meaning is a NEW KIND (RFC-0006 §8).

- entity: SeverityDeclaration
  context: engine
  classification: engine_artifact
  code: src/financeos/core/engines/rule_engine.py:551
  table: null
  authority: [RFC-0007 §3.1, ADR-L02, ADR-L04, RFC-0011 ERR-1]
  invariants: []
  attributes:
    - formula: str | None            # NO DEFAULT — a kind cannot be registered without deciding
  relations:
    - declared_on: ConditionKindSpec
  notes: >
    `formula` has no default, so registration FORCES a decision: either a formula in domain
    terms — DIMENSIONLESS, reading 1.0 at the kind's OWN firing threshold and rising
    monotonically — or an EXPLICIT None. An explicit None means "this kind cannot express
    urgency", which is a REAL SEMANTIC, not missing data: hence severity = NULL, hence
    NULLS LAST in every ordering.

- entity: TraceRecorder
  context: engine
  classification: engine_artifact
  code: src/financeos/core/engines/rule_engine.py:349
  table: null
  authority: [RFC-0006 §4.1, RFC-0009 §4.1, I-6]
  invariants: [I-6]
  attributes:
    - threaded_through: every evaluator, as its third argument
  relations:
    - accumulates: EvaluationTrace
    - executes: StepOp (via apply_op — the SAME implementation replay uses)
  notes: >
    THE TRACE IS NOT EMITTED, IT IS ACCUMULATED. Reading a fact appends a Binding; every
    arithmetic step goes through the recorder and appends a Step. THERE IS NO CODE PATH THAT
    EVALUATES WITHOUT PRODUCING A TRACE, because the values being evaluated ARE the trace
    bindings. I-6 therefore cannot decay into decoration: decoration would require a second,
    UNTRACED arithmetic path, and one does not exist. Do not create one.

