- entity: Outcome
  context: shared
  classification: enum
  code: src/financeos/core/shared/enums.py:59
  table: null                        # alert.outcome VARCHAR with a 4-value CHECK
  authority: [ADR-0016, RFC-0006 §5, RFC-0009 §3.2]
  invariants: []
  attributes:
    - members: FIRED | NOT_FIRED | SKIPPED | ERROR
  relations:
    - carried_by: RuleFiring, EvaluationTrace, Alert
    - gates: Recommendation (FIRED only)
    - feeds: run health panel (SKIPPED, ERROR)
  semantics:
    FIRED: the predicate held. Produces exactly one Recommendation (ACTUAL runs only).
    NOT_FIRED: the predicate was evaluated and did NOT hold. Still persisted, still traced.
    SKIPPED: the rule COULD NOT BE EVALUATED. Carries a SkipReason. severity is NULL.
    ERROR: evaluation raised. Carries `error`. The run CONTINUES. severity is NULL.
  notes: >
    SKIPPED != NOT_FIRED (ADR-0016). This is the single most important distinction in the
    system and the easiest to get wrong. A rule that could not be evaluated is NOT a rule that
    found nothing: conflating them REPORTS COMPLIANCE EXACTLY WHEN THE SYSTEM KNOWS LEAST about
    the portfolio. Both SKIPPED and ERROR are excluded from findings and routed to run health.

- entity: SkipReason
  context: shared
  classification: enum
  code: src/financeos/core/shared/enums.py:73
  table: null                        # inside alert.trace JSON
  authority: [RFC-0006 §5, RFC-0007 §4.1, RFC-0007 §5, ADR-L06]
  invariants: []
  attributes:
    - members: disabled | missing_fact | stale_fact | zero_denominator | zero_portfolio_value | heterogeneous_strategies
  relations:
    - carried_by: RuleFiring, EvaluationTrace, FactUnavailable
    - labelled_by: P22 (Italian skip-reason labels + teaching glosses)
  semantics:
    disabled: Rule.enabled is False. A disabled rule is SKIPPED, never NOT_FIRED.
    missing_fact: a keyed fact the kind needed is simply absent.
    stale_fact: the fact was older than max_staleness. See StaleFactNote.
    zero_denominator: a divide_safe hit a zero denominator.
    zero_portfolio_value: an empty scope — a legitimate onboarding state, not an error.
    heterogeneous_strategies: >
      a PORTFOLIO-scope evaluation cannot resolve one target tree because its governed Buckets
      follow DIFFERENT StrategyVersions (RFC-0007 §5). NEVER AVERAGED — mixed governance
      produces this skip, and an average would invent a policy nobody declared.
  notes: heterogeneous_strategies is the newest member (ADR-L06 / commit 2dd7346).

- entity: Priority
  context: shared
  classification: enum
  code: src/financeos/core/shared/enums.py:20
  table: null                        # alert.priority / recommendation ordering
  authority: [RFC-0008 §3]
  invariants: []
  attributes:
    - members: CRITICAL | HIGH | MEDIUM | LOW | INFO
    - ordinal_via: priority_rank() at src/financeos/core/shared/enums.py:39   # CRITICAL=4 .. INFO=0
  relations:
    - authored_on: Rule
    - promoted_to_column_on: Alert
    - first_clause_of: the ordering triple
  notes: >
    AUTHOR-DECLARED importance, NEVER overridden by computation (RFC-0008 §3). Priority
    DOMINATES severity in the ordering — a CRITICAL rule at severity 1.01 outranks an INFO rule
    at severity 40. Note: mv_finding's inline CASE uses 5..1 while priority_rank() uses 4..0.
    Both are monotonic and only ever compared within their own expression, so the offset is
    harmless — but do not assume the two literals match.

- entity: SuggestionClass
  context: shared
