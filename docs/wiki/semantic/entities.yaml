    - price: PriceAmount | None      # None on DIVIDEND/COUPON primaries (quantity == 0)
    - fees: MoneyAmount
    - currency: Currency
    - import_batch_id: UUID | None
    - corrects_id: OperationId | None
    - transfer_pair_id: UUID | None
