- entity: ApportionmentLine
  context: portfolio
  classification: derived_read_model
  code: src/financeos/core/portfolio/apportionment.py:32
  table: null
  authority: [ADR-0025, ADR-L04 §4.4 D5]
  invariants: [I-9]
