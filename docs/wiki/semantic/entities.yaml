  relations:
    - belongs_to: Portfolio
    - governed_by: Strategy (exactly one — I-3)
    - scope_of: EvaluationRun (ScopeKind.BUCKET — the normal case, ADR-0020)
  notes: >
    Thin since ADR-0025 moved apportionment OUT of the aggregate. VirtualHolding is now a
    derived read model, so the Bucket's transactional boundary holds no apportionment state.
    A Strategy is a policy applied per Bucket (ADR-0020) — several Buckets may share one.

