- entity: EvaluationTrace
  context: decision
  classification: value_object
  code: src/financeos/core/decision/trace.py:122
  table: null                        # alert.trace JSON (ADR-0013)
  authority: [RFC-0009 §4.1, RFC-0006 §4.1, ADR-0013, RFC-0009 §7.2]
  invariants: [I-6]
  attributes:
    - trace_version: int             # TRACE_VERSION == 1
    - condition: ConditionRef
    - bindings: tuple[Binding, ...]
    - steps: tuple[Step, ...]
    - outcome: Outcome
    - skip_reason: SkipReason | None
    - unavailable_facts: tuple[FactUnavailable, ...]
    - stale_facts: tuple[StaleFactNote, ...]
    - error: str | None
    - message_bindings: Mapping[str, str]   # CAPTURED, not re-derived at render time
  replay_contract: >
    Given `condition` plus the `value` of every binding, and IGNORING ALL `source` FIELDS,
    re-executing `steps` must reproduce `outcome` exactly (RFC-0009 §4.1). Executable form:
    rule_engine.replay_trace().
  relations:
    - carried_by: Alert (I-6)
    - accumulated_by: TraceRecorder
    - replayed_by: rule_engine.replay_trace
  notes: >
    STORED TRACES ARE NEVER MIGRATED (RFC-0009 §7.2): a schema change bumps TRACE_VERSION and
    the reader for EVERY prior version is retained. Four load-bearing properties: (1) every
    binding carries both value (Stage A) and source (Stage B) — the A subset-of B mechanism of
    ADR-0004; (2) steps are explicit and ORDERED, which makes replay mechanical not
    interpretive; (3) Decimals serialize as STRINGS — a trace that round-trips 0.4 as
    0.4000000000000001 is not an audit artifact; (4) message_bindings are CAPTURED, so a March
    message is reproducible verbatim in October. One deliberate deviation from RFC-0009 §4.1's
    illustrative JSON: a step's operand list is `inputs`, not `in` (Python keyword).

