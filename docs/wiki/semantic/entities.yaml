    - folds_into: Holding (derived, never stored)
  notes: >
    Append-only (I-10, C6): no setters, no repository update path. Corrections are
    compensating CORRECTION rows (ADR-0028), never mutations. The model validator enforces
    exactly the ROW-LOCAL rules (the ADR-L01 truth table over corrects_id / transfer_pair_id
