- entity: StrategyVersion
  context: strategy
  classification: aggregate_root
  code: src/financeos/core/strategy/strategy.py:118
  table: strategy_version
  authority: [RFC-0007 §7, E2, ADR-0027, ADR-0030, ADR-0035]
  invariants: [I-11, I-22]
  attributes:
    - id: StrategyVersionId
    - strategy_id: StrategyId
    - parent_version_id: StrategyVersionId | None   # lineage
    - definition: StrategyDefinition                 # stored as JSON
    - change_note: str                               # REQUIRED on freeze
    - frozen_at: Instant
  relations:
    - version_of: Strategy
    - parent_of: StrategyVersion (lineage chain)
    - contains: Rule (document containment, ADR-0027 — not an FK relation)
    - contains: TargetAllocation
    - pinned_by: EvaluationRun (I-11)
    - sole_source_of: Recommendation.rationale (ADR-0023)
  notes: >
    IMMUTABLE. Written on every change to the Strategy aggregate — targets, tolerances, rules,
    horizon, risk, principles, objective, name, description — with NO materiality judgment
    (RFC-0007 §7). Goal links sit OUTSIDE the freeze boundary (ADR-0030). change_note is the
    only place the WHY of a change lives and is unrecoverable later.
    `.rule(rule_id)` is the integrity guarantee that replaced the dropped FK (ADR-0027).

- entity: StrategyDefinition
  context: strategy
  classification: value_object
  code: src/financeos/core/strategy/strategy.py:81
  table: null                        # strategy_version.definition JSON
  authority: [ADR-0023, RFC-0007 §7]
  invariants: [I-4]
  attributes:
    - name: str
    - description: str | None
    - objective: str | None
    - horizon: Horizon
    - risk: RiskProfile
    - targets: TargetAllocation
    - rules: tuple[Rule, ...]        # I-4: at least one; ids distinct within a version
  relations:
    - frozen_into: StrategyVersion
    - resolves: Rule (via .rule(rule_id), raises RuleNotInVersionError)
  notes: >
    The frozen document: everything an evaluation is ALLOWED to cite (ADR-0023). Sole input to
    a Recommendation's assembled rationale — which is what makes the system restate the user's
    own prior declaration rather than assert suitability (the MiFID firewall as a schema).

- entity: Rule
  context: strategy
  classification: entity
  code: src/financeos/core/strategy/rule.py:90
  table: null                        # NO TABLE AT ALL — ADR-0027
  authority: [RFC-0004 §2.2, RFC-0006 §2, ADR-0027, ADR-L06]
  invariants: [I-4, I-5, I-11]
  attributes:
    - id: RuleId                     # STABLE across versions — firing history depends on it
    - name: str
    - enabled: bool                  # False => SKIPPED(disabled), never NOT_FIRED
    - priority: Priority             # author-declared, NEVER overridden by computation
    - suggestion_class: SuggestionClass
    - message: str                   # rendered from trace message_bindings
    - condition: LeafCondition
    - scope_gate: RuleScopeGate | None   # None == unconstrained (ADR-L06 §4.1 default)
  relations:
    - child_of: StrategyVersion (frozen into StrategyDefinition.rules, ADR-0027)
    - evaluates_to: RuleFiring (one per evaluation)
    - persisted_as: Alert (one per firing, whatever the outcome)
    - produces: Recommendation (only when Outcome.FIRED — I-5)
    - keyed_into: finding_key (rule_id is the first hash component)
  notes: >
    A Rule has NO relational identity: alert.rule_id and recommendation.rule_id carry no
    foreign key (ADR-0027). It is resolved via run_id -> strategy_version.definition.rules,
    guarded by StrategyDefinition.rule() plus a property test rather than an FK. A future agent
    grepping for a `rule` table will find nothing — that is correct, not a missing migration.
    rule_id is stable ACROSS versions; the definition is frozen PER version.

- entity: LeafCondition
  context: strategy
  classification: value_object
  code: src/financeos/core/strategy/rule.py:29
  table: null                        # inside strategy_version.definition JSON
  authority: [RFC-0006 §2, RFC-0006 §3, ADR-0014, RFC-0006 §8]
  invariants: []
  attributes:
    - kind: str                      # catalog kind, e.g. "drift_outside_tolerance"
    - kind_version: int              # recorded in EVERY trace
    - params: Mapping[str, str]      # canonical STRING form
    - max_staleness: timedelta | None   # per-leaf override of the kind's default
  relations:
    - drawn_from: ConditionKindSpec (the closed catalog, ADR-0014)
    - keyed_into: finding_key (canonical(condition.params) is the third hash component)
    - recorded_as: ConditionRef (in the trace)
  notes: >
    A leaf of a CLOSED TYPED CATALOG, not an expression language (ADR-0014). Params are
    validated against the catalog's Pydantic model at AUTHORING time (app layer, on freeze);
    the engine parses them at evaluation time — so core.strategy never imports the engine
    registry and the frozen document stays self-describing. A kind's semantics NEVER change:
    a new meaning is a new kind (RFC-0006 §8). Combinators (all_of/any_of/not, depth 1 only)
    are specified but OUT of skeleton scope (RFC-0006 §12) — no combinator type exists yet.

- entity: RuleScopeGate
  context: strategy
  classification: value_object
  code: src/financeos/core/strategy/rule.py:48
  table: null
  authority: [ADR-L06, RFC-0006 §3.1, RFC-0007 §5, docs/plans/W2-rule-scope-partition.md §2]
  invariants: [C2]
  attributes:
    - kind: ScopeKind                # BUCKET | PORTFOLIO
    - bucket_id: BucketId | None     # only meaningful when kind == BUCKET; None == any governed Bucket
  relations:
    - gates: Rule
    - read_by: app/evaluate_strategy.py (NEVER by the rule engine — C2, RFC-0006 §3.1)
  notes: >
    Nothing about a LeafCondition's own params says whether a Rule runs once per governed
    Bucket, only at the whole-Portfolio call, or only for one named Bucket. The `scope` param
    on the three kinds that carry it is a MESSAGE BINDING, never compared against the facts'
    actual scope. This field carries that intent, and the APPLICATION layer subsets sv.rules
    before calling RuleEngine.evaluate — the engine never sees a gate.

- entity: TargetAllocation
  context: strategy
  classification: value_object
  code: src/financeos/core/strategy/targets.py:141
  table: null                        # inside strategy_version.definition JSON
  authority: [ADR-0017, RFC-0007 §2, RFC-0011 ERR-5]
  invariants: [I-13, I-14]
  attributes:
    - children: tuple[TargetNode, ...]   # root's own weight is 1 by definition, not stored
  relations:
    - frozen_into: StrategyDefinition
    - resolves_to: LeafTarget (via .leaves())
    - consumed_by: strategy_engine.compute_drift, strategy_engine.compute_targets
  notes: >
    A tree of RELATIVE weights (each node's weight is relative to its PARENT), so restructuring
    a subtree is a local edit and the exported YAML keeps a readable diff (ADR-0009). A leaf's
    effective target is the PRODUCT of weights along the root->leaf path. I-13 (revised, ERR-5):
    children of EVERY node sum to 1 within an explicit Decimal epsilon (WEIGHT_SUM_EPSILON),
    enforced in the constructor — so effective leaf targets sum to 1 by construction, with no
    separate global check. Also enforced: distinct keys per level, and no AssetClass targeted by
    more than one leaf. The skeleton authors a depth-1 tree, a strict special case.

- entity: TargetNode
  context: strategy
  classification: value_object
  code: src/financeos/core/strategy/targets.py:80
  table: null
  authority: [ADR-0017, ADR-0018, RFC-0007 §2.1]
  invariants: [I-13, I-14]
  attributes:
    - key: AssetClass                # I-14 — NEVER an AssetId
    - weight: Weight                 # relative to parent
    - tolerance: Tolerance | None    # REQUIRED on a leaf, optional on an interior node
    - children: tuple[TargetNode, ...]
  relations:
    - targets: AssetClass (leaf only)
    - child_of: TargetNode | TargetAllocation
  notes: >
    A LEAF MUST declare a Tolerance: a target with no band cannot yield the effective_band
    every drift finding is measured against. An interior node MAY declare one; interior breaches
    are a DISTINCT finding reported by their own rule (RFC-0007 §2.1) and are NOT inherited by
    leaves. Drift is computed at leaves only.

- entity: LeafTarget
  context: strategy
  classification: derived_read_model
  code: src/financeos/core/strategy/targets.py:127
  table: null
  authority: [RFC-0007 §2.1, ADR-L05 §5]
  invariants: [I-13, I-14]
  attributes:
    - asset_class: AssetClass
    - path: tuple[str, ...]
    - effective_target: WeightAmount   # product of weights along root->leaf
    - tolerance: Tolerance
  relations:
    - resolved_from: TargetAllocation
    - consumed_by: untargeted_allocation (FACT_TARGETS)
  notes: >
    FACT_TARGETS exists separately from FACT_DRIFT (ADR-L05 §5) precisely so
    untargeted_allocation can test MEMBERSHIP without depending on drift being computable.
    target_path renders the dotted path for SourceRef.path.

- entity: Tolerance
  context: strategy
  classification: value_object
  code: src/financeos/core/strategy/targets.py:47
  table: null
  authority: [ADR-0018, RFC-0007 §3, RFC-0007 §3.1]
  invariants: []
  attributes:
    - kind: ToleranceKind            # ABSOLUTE | RELATIVE
    - band: WeightAmount             # model validator: MUST be > 0
  relations:
    - declared_on: TargetNode
    - produces: effective_band (consumed by drift severity)
  notes: >
    ABSOLUTE(band) is +/-band in PERCENTAGE POINTS of scope weight. RELATIVE(band) is
    +/-(band x effective_target) — the proportional form, without which a +/-5pp band on a 4%
    target would let the position VANISH without registering a breach. A RELATIVE band on a ZERO
    target is legitimately zero, which is exactly why severity is nullable (ERR-1).

- entity: Horizon
  context: strategy
  classification: value_object
  code: src/financeos/core/strategy/strategy.py:28
  table: null
  authority: [RFC-0007 §7]
  invariants: []
  attributes:
    - years: int | None
    - target_date: date | None
  relations:
    - part_of: StrategyDefinition
  notes: EXACTLY ONE of years / target_date — enforced by a model validator.

- entity: RiskLevel
  context: strategy
  classification: enum
  code: src/financeos/core/strategy/strategy.py:41
  table: null
  authority: [P31, P32]
  invariants: []
  attributes:
    - members: VERY_CONSERVATIVE(1) | CONSERVATIVE(2) | MODERATE(3) | BALANCED(4) | GROWTH(5) | HIGH_GROWTH(6) | AGGRESSIVE(7)
    - ordinal_via: risk_level_rank() at src/financeos/core/strategy/strategy.py:69
  relations:
    - part_of: RiskProfile
  notes: >
    The seven-step UCITS KIID (SRRI) / PRIIPs KID (SRI) synthetic risk scale, per P31/P32. This
