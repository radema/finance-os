  relations:
    - part_of: AllocationBreakdown
    - consumed_by: untargeted_allocation, allocation_absent (FACT_ALLOCATION)
  notes: >
    One AssetClass's value and share of a scope. Covers every HELD class, targeted or not —
    unlike DriftLine, which covers only targeted leaves. That asymmetry is why
    untargeted_allocation needs both FACT_ALLOCATION and FACT_TARGETS.

- entity: AllocationBreakdown
  context: portfolio
  classification: derived_read_model
  code: src/financeos/core/portfolio/holding.py:62
  table: null
  authority: [RFC-0004 §2.3, RFC-0007 §4.1]
  invariants: []
  attributes:
