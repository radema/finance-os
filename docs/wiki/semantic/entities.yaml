- entity: Finding
  context: read_side
  classification: sql_view
  code: src/financeos/adapters/duckdb/migrations/001_init.sql:413
  table: mv_finding                  # a plain VIEW, NOT a materialized view
  authority: [RFC-0008 §4, ADR-0021, RFC-0011 §4 R-2, RFC-0011 ERR-1]
  invariants: []
  attributes:
    - finding_key: str               # GROUP BY key
    - rule_id: str                   # GROUP BY key
    - first_recommendation_id: arg_min(r.id, r.recorded_at)
    - latest_recommendation_id: arg_max(r.id, r.recorded_at)
    - first_seen: min(run.as_of)
    - last_seen: max(run.as_of)
    - occurrences: count(*)
    - current_severity: arg_max(a.severity, r.recorded_at)
    - current_priority: arg_max(a.priority, r.recorded_at)
    - priority_rank: arg_max(CASE a.priority ... END, r.recorded_at)   # CRITICAL=5 .. INFO=1
  ordering: priority_rank DESC, current_severity DESC NULLS LAST, rule_id ASC
  filters: WHERE run.mode = 'ACTUAL'
  relations:
    - groups: Recommendation (by finding_key, rule_id)
    - joins: alert (for severity/priority), evaluation_run (for as_of and mode)
    - read_by: adapters/duckdb/queries/findings.py
  notes: >
    DEDUPLICATION IS READ-SIDE (ADR-0021). The Decision Engine deduplicates NOTHING: a mutable
    Recommendation would be a row whose run_id no longer identifies the run that produced its
    content. finding_key is a STORED COLUMN on recommendation (written at insert time), not
    something this view derives — the view only GROUPs on it.
    CORRELATED FINDINGS ARE NEVER COLLAPSED (RFC-0008 §4.1): equity-under and bonds-over are
    two findings, because they have different finding_keys and are genuinely two facts.

- entity: finding_key
  context: read_side
  classification: value_object
  code: src/financeos/core/engines/decision_engine.py:158
  table: recommendation.finding_key  # indexed: ix_recommendation_finding_key
  authority: [RFC-0008 §4, ADR-0021, RFC-0011 §4 R-2]
  invariants: []
  formula: sha256_hex(str(rule.id), str(run.scope.id), canonical_json(dict(rule.condition.params)))
  components:
    - rule_id: which Rule
    - scope_id: which Bucket or Portfolio
    - canonical(condition.params): which exact parameterisation
  deliberately_excluded:
    - strategy_version_id: >
        editing an UNRELATED rule freezes a new version and would otherwise RESET the finding's
        history, making "this has been drifting for five months" unanswerable.
  relations:
    - identifies: Finding (across runs)
    - groups: Recommendation
    - resolved_against_by: Decision (SPECIFIED, NOT IMPLEMENTED)
  danger: >
    ANY resolution or dedup logic keying on LESS than the full finding_key SILENTLY HIDES LIVE
    FINDINGS. THIS BUG HAS ALREADY SHIPPED ONCE. Pinned by
    tests/test_finding_resolution.py::test_editing_rule_params_does_not_resolve_an_unrelated_finding.
    scope_id is a guaranteed component even though most kinds also carry scope in params — the
    redundancy is kept ON PURPOSE (R-2) so a future kind whose params omit scope cannot silently
    merge findings across Buckets.
  notes: >
    A stored column written at recommendation-insert time, NOT derived by mv_finding — the view only
    GROUPs on the already-hashed value. Indexed by ix_recommendation_finding_key. Identity is stable
    ACROSS runs and ACROSS StrategyVersions, which is what makes "how long has this been true?"
    answerable. See the `danger` field before writing anything that resolves or dedups a finding.

- entity: Holding_read_view
  context: read_side
  classification: sql_view
  code: src/financeos/adapters/duckdb/migrations/001_init.sql
  table: mv_holding                  # a plain VIEW, NOT a materialized view
  authority: [ADR-0003]
  invariants: []
  attributes: [asset_id, portfolio_id, quantity: SUM over operation]
  relations:
    - derived_from: operation
    - read_by: adapters/duckdb/queries/holdings.py, allocation.py, buckets.py
  notes: >
    The SQL half of ADR-0003. Neither mv_ view is a real DuckDB materialized view — both are
    plain views recomputed per query. The mv_ prefix records INTENT (a derived model), not a
    storage mechanism.

