    - unpriced_assets: tuple[AssetId, ...]
  relations:
    - produced_by: portfolio_engine.compute_allocation
    - consumed_by: strategy_engine.compute_drift
  notes: >
    is_complete is False when any held Asset could not be valued. An INCOMPLETE breakdown must
    not be consumed: it would produce a partial denominator, which RFC-0007 §4.1 forbids, so
    the Strategy Engine SKIPs instead of computing a wrong weight.

- entity: ResidualComputation
  context: portfolio
  classification: derived_read_model
  code: src/financeos/core/portfolio/residual.py:13
  table: null
  authority: [ADR-0029, RFC-0011 §12.4]
  invariants: [I-9]
  attributes:
