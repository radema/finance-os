- entity: Strategy
  context: strategy
  classification: aggregate_root
  code: src/financeos/core/strategy/strategy.py:149
  table: strategy
  authority: [RFC-0004 §2.2, RFC-0007 §5, ADR-0020, RFC-0011 ERR-8]
